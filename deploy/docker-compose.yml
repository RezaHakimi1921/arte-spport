name: arte-spport

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sport
      POSTGRES_USER: sport
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sport -d sport"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: src/Arte.Sport.Api/Dockerfile
    image: arte-spport-api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=sport;Username=sport;Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY:?set in .env}
      Otp__Pepper: ${OTP_PEPPER:?set in .env}
      Sms__Provider: ${SMS_PROVIDER:-iranpayamak}
      Sms__IranPayamak__ApiKey: ${IRANPAYAMAK_API_KEY:-}
      Sms__IranPayamak__LineNumber: ${IRANPAYAMAK_LINE:-}
      Sms__IranPayamak__Pattern: ${IRANPAYAMAK_OTP_PATTERN:-}
      Sms__IranPayamak__CodeParam: ${IRANPAYAMAK_OTP_PARAM:-code}
      Features__Receipts: "false"
      Features__TrainingPlans: "false"
      Features__AvalAi: "false"
      AvalAi__RetentionDays: "90"
      AvalAi__MonthlyCostCapRials: "0"
    networks:
      internal:
        aliases: [arte-sport-api]
      egress: {}

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../web/dist:/srv:ro
    networks:
      internal: {}
      edge:
        aliases: [arte-sport-web]
    read_only: true
    tmpfs: ["/tmp", "/data", "/config"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

networks:
  internal:
    internal: true
  egress: {}
  edge:
    external: true
    name: ${EDGE_NETWORK:-personalwallet_default}

volumes:
  db_data:
